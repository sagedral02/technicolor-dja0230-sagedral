server {
    listen 9080;
    listen [::]:9080;
    server_name localhost;
    root /www/sagedral;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api {
        default_type application/json;
        content_by_lua_file /www/sagedral/api.lua;
    }
}
